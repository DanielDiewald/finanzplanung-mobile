<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#4c86af">
  <meta name="color-scheme" content="light dark">
  <title>Benedikt · Offline</title>
  <style>
    :root{color-scheme:light dark;--bg:#f5f7f8;--surface:#fff;--text:#17232c;--muted:#5f6e77;--line:#d7e0e4;--primary:#4c86af;--soft:#e6f0f6}*{box-sizing:border-box}@media(prefers-color-scheme:dark){:root{--bg:#1D1D1D;--surface:#25282a;--text:#edf1f1;--muted:#9aa7aa;--line:#3b4245;--soft:#273b48}}body{font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;background:var(--bg);color:var(--text);display:grid;min-height:100dvh;place-items:center;padding:1.5rem}.box{width:min(100%,34rem);background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:1.5rem;box-shadow:0 16px 42px rgba(0,0,0,.1)}.brand{display:flex;align-items:center;gap:.65rem;margin-bottom:1.2rem}.mark{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:var(--primary);color:#111820;font-weight:850}.brand strong{display:block}.brand small{display:block;color:var(--muted)}h1{font-size:1.25rem;margin:.2rem 0 .4rem}p{color:var(--muted)}button{min-height:44px;font:inherit;font-weight:700;padding:.7rem 1rem;border:1px solid var(--primary);border-radius:12px;background:var(--primary);color:#111820;cursor:pointer}
  </style>
</head>
<body>
  <main class="box">
    <div class="brand"><span class="mark" aria-hidden="true">B</span><span><strong>Benedikt</strong><small>dein Finanzplaner</small></span></div>
    <h1>Du bist gerade offline</h1>
    <p>Diese Seite ist noch nicht im lokalen Cache verfügbar. Öffne Benedikt einmal online über den bereitgestellten statischen Webserver und versuche es danach erneut.</p>
    <button onclick="location.href='./index.html#/month'">Zu Benedikt</button>
  </main>
</body>
</html>
